name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev tools
        run: python -m pip install -e '.[dev]'

      - name: Run unit tests
        run: python -m unittest discover -s tests -q -b

      - name: Run CLI smoke check
        run: python -m trust_me.cli run --root . --no-save --format text

      - name: Run Ruff
        run: python -m ruff check trust_me tests

      - name: Run mypy
        run: python -m mypy trust_me
