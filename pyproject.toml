[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-me"
version = "0.1.0"
description = "Harness-first reliability checker for AI-generated code patches"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
authors = [
    { name = "Bic1210" },
]
keywords = ["ai", "code-review", "patches", "verification", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff",
]

[project.scripts]
trust-me = "trust_me.cli:main"

[project.urls]
Homepage = "https://github.com/Bic1210/trustmeagent"
Repository = "https://github.com/Bic1210/trustmeagent"
Issues = "https://github.com/Bic1210/trustmeagent/issues"

[tool.setuptools.packages.find]
include = ["trust_me*"]
